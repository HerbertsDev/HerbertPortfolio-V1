<header class="site-header">
  <div class="header-inner container">
    <a
      class="wordmark"
      href="#inicio"
      aria-label="Herbert — início"
      (click)="selectSection('#inicio')"
    >
      Herbert
      <span>.dev</span>
    </a>
    <nav
      class="desktop-navigation"
      aria-label="Navegação principal"
    >
      @for (link of links; track link.href) {
      <a
        [href]="link.href"
        [class.contact-link]="link.href === '#contato'"
        [class.is-active]="isActive(link.href)"
        [attr.aria-current]="isActive(link.href) ? 'location' : null"
        (click)="selectSection(link.href)"
      >
        {{ link.label }}
      </a>
      }
    </nav>
  </div>
</header>

<nav class="mobile-tab-bar" aria-label="Navegação móvel">
  @for (link of mobileLinks; track link.href) {
  <a
    [href]="link.href"
    [class.is-active]="isActive(link.href)"
    [attr.aria-current]="isActive(link.href) ? 'location' : null"
    (click)="selectSection(link.href)"
  >
    {{ link.label }}
  </a>
  }
</nav>
